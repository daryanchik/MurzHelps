<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>MurzHelps</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="renderer.js"></script>
  </head>
  <body>
    <img id="murz" src="../../assets/murz.png" alt="Мурз улёгся. Перерыв начался." draggable="false">
    <button id="dismiss" type="button">Прогнать Мурза</button>
    <section id="break-info" aria-label="Перерыв">
      <output id="remaining" aria-label="Осталось времени">00:00</output>
      <div id="pause-status"></div>
      <p>Отдыхай спокойно, мой человечек, твою работу я сожрал</p>
    </section>
  </body>
</html>
