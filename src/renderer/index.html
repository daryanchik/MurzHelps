<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>MurzHelps</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="renderer.js"></script>
</head>
<body>
  <img id="murz" alt="" draggable="false">
  <section id="visit-info">
    <div id="status"></div>
    <output id="remaining">00:00</output>
    <div id="pause-status"></div>
    <p id="message"></p>
  </section>
  <button id="dismiss" type="button" disabled></button>
  <button id="snooze" type="button" disabled></button>
</body>
</html>
