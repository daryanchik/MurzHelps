<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MurzHelps</title>
  <link rel="stylesheet" href="settings.css">
  <script src="settings.js" defer></script>
</head>
<body>
  <header><div id="brand"></div><h1 id="heading"></h1><p id="subtitle"></p></header>
  <form id="settings" novalidate>
    <div id="fields"></div>
    <div class="auto-start">
      <label><input id="autoStart" type="checkbox" disabled aria-describedby="autoStart-hint autoStart-error"><span id="autoStart-label"></span></label>
      <p id="autoStart-hint" class="hint"></p><small id="autoStart-error" class="error"></small>
    </div>
    <p id="future" class="hint"></p>
    <div id="message" role="status" aria-live="polite"></div>
    <div class="actions"><button id="cancel" type="button"></button><button id="save" type="submit" disabled></button></div>
  </form>
</body>
</html>
